# Publica una release al empujar una etiqueta vX.Y.Z (o vX.Y.Z-beta...).
# Los paquetes de macOS se generan en un runner de macOS porque allí se firman ad hoc; sin firma, macOS
# en Apple Silicon no arranca el ejecutable.
name: Publicar release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    env:
      # Los tests comprueban textos y formatos en la cultura con la que se desarrollan.
      LANG: gl_ES.utf8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test -c Release

  empaquetar:
    needs: pruebas
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   os: ubuntu-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64,   os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: bash publicar/empaquetar.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: paquete-${{ matrix.rid }}
          path: |
            artefactos/*.zip
            artefactos/*.tar.gz
          if-no-files-found: error

  release:
    needs: empaquetar
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: La etiqueta coincide con la versión del proyecto
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Spd.Presentacion/Spd.Presentacion.csproj)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión $version del .csproj"; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true
      - name: Sumas de comprobación
        run: cd artefactos && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notas="publicar/notas-$GITHUB_REF_NAME.md"
          [ -f "$notas" ] || { echo "Falta $notas"; exit 1; }
          previa=""
          case "$GITHUB_REF_NAME" in *-*) previa="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" artefactos/* --title "Fórmula SPD ${GITHUB_REF_NAME#v}" --notes-file "$notas" $previa
