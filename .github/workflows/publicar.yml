# Publica una release al empujar una etiqueta vX.Y.Z (o vX.Y.Z-beta...).
# Si la release ya existe (p. ej. creada a mano en GitHub, que empuja la etiqueta y lanza este mismo
# workflow), los paquetes se suben a ella en vez de fallar. También se puede lanzar a mano indicando una
# etiqueta ya publicada, para (re)subir sus paquetes: se compila el código de esa etiqueta, no el de la rama.
# Los paquetes de macOS se generan en un runner de macOS porque allí se firman ad hoc; sin firma, macOS
# en Apple Silicon no arranca el ejecutable.
name: Publicar release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      etiqueta:
        description: 'Etiqueta ya publicada cuyos paquetes se suben a su release (p. ej. v0.2.0-beta). Vacío: solo empaquetar.'
        required: false
        default: ''

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # La etiqueta que se publica: la empujada o la indicada al lanzarlo a mano.
  ETIQUETA: ${{ inputs.etiqueta || github.ref_name }}
  REF_CODIGO: ${{ inputs.etiqueta || github.ref }}

jobs:
  pruebas:
    runs-on: ubuntu-latest
    env:
      # Los tests comprueban textos y formatos en la cultura con la que se desarrollan.
      LANG: gl_ES.utf8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF_CODIGO }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test -c Release

  empaquetar:
    needs: pruebas
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   os: ubuntu-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64,   os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF_CODIGO }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: bash publicar/empaquetar.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: paquete-${{ matrix.rid }}
          path: |
            artefactos/*.zip
            artefactos/*.tar.gz
          if-no-files-found: error

  release:
    needs: empaquetar
    if: startsWith(github.ref, 'refs/tags/v') || inputs.etiqueta != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF_CODIGO }}
      - name: La etiqueta coincide con la versión del proyecto
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Spd.Presentacion/Spd.Presentacion.csproj)
          if [ "$ETIQUETA" != "v$version" ]; then
            echo "La etiqueta $ETIQUETA no coincide con la versión $version del .csproj"; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true
      - name: Sumas de comprobación
        run: cd artefactos && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Crear la release o subir los paquetes a la existente
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notas="publicar/notas-$ETIQUETA.md"
          [ -f "$notas" ] || { echo "Falta $notas"; exit 1; }
          previa=""
          case "$ETIQUETA" in *-*) previa="--prerelease" ;; esac
          if gh release view "$ETIQUETA" > /dev/null 2>&1; then
            echo "La release $ETIQUETA ya existe: se suben los paquetes (sustituyendo los que hubiera)."
            gh release upload "$ETIQUETA" artefactos/* --clobber
            # Solo se completa lo que falte: unas notas escritas a mano no se pisan.
            if [ -z "$(gh release view "$ETIQUETA" --json body --jq .body)" ]; then
              gh release edit "$ETIQUETA" --notes-file "$notas"
            fi
            if [ -n "$previa" ]; then gh release edit "$ETIQUETA" --prerelease; fi
          else
            gh release create "$ETIQUETA" artefactos/* --title "Fórmula SPD ${ETIQUETA#v}" --notes-file "$notas" $previa
          fi
